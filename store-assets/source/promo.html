<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invisibles promotional tile</title>
  <style>
    *{box-sizing:border-box}html,body{width:440px;height:280px;margin:0;overflow:hidden}
    body{position:relative;background:#17324d;color:#fffaf1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:25px 27px}
    body:after{content:"";position:absolute;width:190px;height:190px;border:24px solid #ef6c2f;border-radius:50%;right:-76px;bottom:-100px;opacity:.95}
    header{display:flex;align-items:center;gap:14px}img{width:58px;height:58px}h1{margin:0;font:700 34px/1 Georgia,serif}
    p{margin:5px 0 0;color:#d9e4e1;font-size:13px}.sample{position:relative;z-index:1;margin-top:22px;padding:14px 15px;background:#fffaf1;color:#17324d;border-radius:10px}
    .before{font:700 15px/1.3 ui-monospace,Consolas,monospace}.code{color:#b74213;background:#ffe3d4;border-radius:4px;padding:2px 4px}.after{margin-top:8px;color:#147d70;font-size:12px;font-weight:750}
    .foot{margin-top:14px;color:#bfe3dc;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  </style>
</head>
<body><header><img src="../../extension/icons/icon128.png" alt=""><div><h1>Invisibles</h1><p>Reveal and clean hidden Unicode locally.</p></div></header><div class="sample"><div class="before">notes<span class="code">U+200B</span> ready<span class="code">U+00A0</span>now</div><div class="after">Clean copy: notes ready now</div></div><div class="foot">No host access · nothing uploaded</div></body>
</html>
