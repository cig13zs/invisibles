<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invisibles promotional tile</title>
  <style>
    *{box-sizing:border-box}html,body{width:440px;height:280px;margin:0;overflow:hidden}
    body{position:relative;background:#241c16;color:#f6f1e8;font-family:"Segoe UI",system-ui,sans-serif;padding:22px 24px}
    body:before{content:"";position:absolute;width:220px;height:220px;right:-70px;bottom:-90px;border-radius:50%;background:rgba(196,83,42,.35)}
    header{display:flex;align-items:center;gap:12px;position:relative}
    img{width:64px;height:64px;border-radius:16px}
    h1{margin:0;font:700 32px/1 Palatino,Georgia,serif;letter-spacing:-.03em}
    p{margin:4px 0 0;color:#d9cfc3;font-size:13px}
    .sample{position:relative;z-index:1;margin-top:16px;padding:14px 16px;background:#fffdf8;color:#241c16;border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.18)}
    .before{font:700 16px/1.4 ui-monospace,Consolas,monospace}
    .code{color:#9f2d22;background:#fde8e2;border-radius:5px;padding:1px 5px;border-bottom:2px solid #c4532a}
    .after{margin-top:8px;color:#1d6b45;font-size:13px;font-weight:750}
    .foot{position:relative;margin-top:14px;color:#e8946a;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <header><img src="../../extension/icons/icon128.png" alt=""><div><h1>Invisibles</h1><p>Reveal and clean hidden Unicode locally.</p></div></header>
  <div class="sample"><div class="before">notes<span class="code">U+200B</span> ready<span class="code">U+00A0</span>now</div><div class="after">Clean copy: notes ready now</div></div>
  <div class="foot">No host access · nothing uploaded</div>
</body>
</html>
